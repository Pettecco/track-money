[project]
name = "track-money"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pettecco", email = "petterson.ikaro@gec.inatel.br" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "psycopg2-binary>=2.9.12",
    "python-jose>=3.5.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
]

[project.scripts]
track-money = "main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
